name: Preview frontend on GitHub Pages
on:
  push:
    branches:
      - master
  # A Pages site has a single deployment, so branch previews are published on
  # demand rather than on every push: run this workflow from the branch you want
  # to preview via the Actions tab.
  workflow_dispatch:

# Only one Pages deployment can be in flight at a time; let a newer push finish
# rather than queueing behind an older one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy preview
    # Fork-only. The canonical deployment is Netlify (see web/netlify.toml); this
    # workflow exists so forks can publish a static preview of frontend changes.
    if: github.repository != 'dandi/dandi-archive'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # GitHub Pages serves project sites from "/<repo>/", not from the domain root.
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
      # The preview is static: it talks to the already-deployed sandbox API, matching
      # the "deploy-preview" context in web/netlify.toml.
      VITE_APP_DANDI_API_ROOT: https://api.sandbox.dandiarchive.org/api/
      VITE_APP_OAUTH_API_ROOT: https://api.sandbox.dandiarchive.org/oauth/
      VITE_APP_OAUTH_CLIENT_ID: Dk0zosgt1GAAKfN8LT4STJmLJXwMDPbYWYzfNtAl
      VITE_APP_DOI_SERVER: https://api.test.datacite.org/
      VITE_APP_SENTRY_ENVIRONMENT: preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the build derives a version string from `git describe`

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Install Vue app
        run: npm ci
        working-directory: web

      - name: Build Vue app
        run: npm run build
        working-directory: web

      - name: Add SPA fallback
        # Pages has no rewrite rule, so deep links are served the 404 page; serving a
        # copy of index.html there lets vue-router resolve the route client-side.
        run: cp web/dist/index.html web/dist/404.html

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          # Create the Pages site on first run, so enabling the preview on a fork
          # requires no manual repository configuration.
          enablement: true

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: web/dist

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
